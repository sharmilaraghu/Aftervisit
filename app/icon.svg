<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!--
    The tab icon: the ring with the pulse beating across it, held still.

    A favicon renders at 16px, so the stroke is fatter than the in-app mark and
    the beat is a single spike. No animation: a favicon never animates.

    Colours are literal rather than tokens: this file is served on its own, with
    no stylesheet to resolve var() against. They are the bench ground, bench ink
    and the amber beat, matching the mark in the app.
  -->
  <rect width="24" height="24" fill="#1c1a18"/>
  <circle cx="12" cy="12" r="8.8" fill="none" stroke="#f6f3ed" stroke-width="2.1"/>
  <path d="M 6 12 H 9.2 L 10.5 8.4 L 12.6 15.8 L 13.9 12 H 18"
        fill="none" stroke="#e8850c" stroke-width="2.1"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
