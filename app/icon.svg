<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!--
    The tab icon: the pulse ring, held still.

    A favicon renders at 16px, so everything is coarsened — a fatter stroke, one
    spike and one dip instead of the full QRS, and a slightly smaller cross so
    the trough clears it. The detail that makes the mark good at 26px turns to
    grey mush at 16. No animation: a favicon never animates.

    Colours are literal rather than tokens: this file is served on its own, with
    no stylesheet to resolve var() against. #c8102e is --danger — the brand
    mark's carved red exception, per DESIGN.md.
  -->
  <rect width="24" height="24" fill="#1c1a18"/>
  <path d="M 16 3.9 A 9 9 0 1 1 8 3.9 L 10 3.9 L 11.7 1.2 L 13.1 5.6 L 14 3.9 L 16 3.9 Z"
        fill="none" stroke="#c8102e" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f6f3ed">
    <rect x="10.2" y="7" width="3.6" height="10"/>
    <rect x="7" y="10.2" width="10" height="3.6"/>
  </g>
</svg>
