# The gate: tests, typecheck and lint on every push to main and every PR.
#
# Needs no secrets. The suite runs on zero credentials — lib/calle/fake-server.ts
# stands in for CALL-E — so nothing here can place a call or touch a database.

name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Reads the version from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
